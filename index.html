<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tarifas</title>

  <!-- PWA: Manifiesto, tema e iconos -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarifas">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    /* ── Reset y base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Contenedor principal ── */
    .container { max-width: 480px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    /* ── Botón de instalación PWA ── */
    .btn-install {
      display: none; /* Se muestra solo si Chrome permite instalación */
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-install:active { transform: scale(0.98); }

    /* ── Input de kilómetros ── */
    .input-group {
      background: #1a1d2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      font-size: 1.3rem;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      text-align: center;
      outline: none;
    }
    .input-group input:focus { border-color: #60a5fa; }

    /* ── Tarjetas de resultado ── */
    .results { display: flex; flex-direction: column; gap: 10px; }

    .card {
      border-radius: 12px;
      padding: 14px 16px;
      display: none; /* se muestra con JS */
    }
    .card.visible { display: block; }

    .card-day { background: linear-gradient(135deg, #1e3a5f, #1a2744); border-left: 4px solid #facc15; }
    .card-night { background: linear-gradient(135deg, #1e2a4a, #141c33); border-left: 4px solid #818cf8; }
    .card-dawn { background: linear-gradient(135deg, #2a1a3e, #1a1130); border-left: 4px solid #c084fc; }
    .card-foranea { background: linear-gradient(135deg, #1a3333, #112222); border-left: 4px solid #34d399; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-title { font-size: 0.9rem; font-weight: 600; }
    .card-price { font-size: 1.5rem; font-weight: 700; }
    .card-desc { font-size: 0.75rem; color: #94a3b8; line-height: 1.4; }

    /* ── Tarjetas descartadas / tachadas para cuando aplica foránea ── */
    .card.discarded {
      opacity: 0.45;
      filter: grayscale(40%);
      position: relative;
    }
    .card.discarded .card-price {
      text-decoration: line-through;
      text-decoration-color: #ef4444;
      color: #94a3b8;
    }
    .card-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }
    .badge-discarded {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .badge-active {
      background: rgba(52, 211, 153, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    /* ── Separador ── */
    .divider {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin: 12px 0 6px;
      display: none;
      font-weight: 600;
    }
    .divider.visible { display: block; }

    /* ── Mensaje vacío ── */
    .empty-msg {
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚕 Calculadora de Tarifas</h1>

    <!-- Botón para instalar PWA directamente -->
    <button id="installBtn" class="btn-install">📲 Instalar aplicación en el dispositivo</button>

    <!-- Campo de entrada -->
    <div class="input-group">
      <label for="kmInput">Kilómetros del viaje</label>
      <input type="number" id="kmInput" placeholder="Ej: 4.05" min="0" max="200" step="any" inputmode="decimal">
    </div>

    <!-- Resultados -->
    <div class="results" id="results">
      <p class="empty-msg" id="emptyMsg">Ingresa los kilómetros para calcular</p>

      <!-- Tarjeta foránea (se muestra primero si supera 17 km) -->
      <div class="card card-foranea" id="cardForanea">
        <div class="card-header">
          <div>
            <span class="card-title">🛣️ <span id="foraneName">Foránea</span></span>
            <span class="card-badge badge-active" id="badgeForanea">Tarifa Aplicable</span>
          </div>
          <span class="card-price" id="priceForanea">—</span>
        </div>
        <p class="card-desc" id="descForanea"></p>
      </div>

      <!-- Separador de estado -->
      <div class="divider" id="divForanea">── Tarifas de ciudad / horario ──</div>

      <!-- Tarjetas de tarifas urbanas (Día, Noche, Madrugada) -->
      <div class="card card-day" id="cardDay">
        <div class="card-header">
          <div>
            <span class="card-title">🌞 Día</span>
            <span class="card-badge badge-discarded" id="badgeDay" style="display: none;">Descartada</span>
          </div>
          <span class="card-price" id="priceDay">—</span>
        </div>
        <p class="card-desc" id="descDay"></p>
      </div>

      <div class="card card-night" id="cardNight">
        <div class="card-header">
          <div>
            <span class="card-title">🌙 Noche</span>
            <span class="card-badge badge-discarded" id="badgeNight" style="display: none;">Descartada</span>
          </div>
          <span class="card-price" id="priceNight">—</span>
        </div>
        <p class="card-desc" id="descNight"></p>
      </div>

      <div class="card card-dawn" id="cardDawn">
        <div class="card-header">
          <div>
            <span class="card-title">🌌 Madrugada</span>
            <span class="card-badge badge-discarded" id="badgeDawn" style="display: none;">Descartada</span>
          </div>
          <span class="card-price" id="priceDawn">—</span>
        </div>
        <p class="card-desc" id="descDawn"></p>
      </div>
    </div>
  </div>

<script>
// ── Configuración de tarifas fijas y puntos de calibración continua ──
const urbanConfigs = {
  day: {
    label: 'día',
    subMinPrice: 34,
    stdMinPrice: 39,
    baseKm: 7.2,
    basePrice: 94,
    ratePerKm: 13,
    // Puntos de calibración [km, precio] de la tabla oficial
    points: [
      [1.7, 39], [1.8, 40], [1.9, 41], [2.0, 2.0, 42], [2.1, 43], [2.2, 44],
      [2.3, 45], [2.4, 46], [2.5, 47], [2.6, 48], [2.7, 49], [2.8, 50],
      [2.9, 51], [3.0, 52], [3.1, 53], [3.2, 54], [3.3, 55], [3.4, 56],
      [3.5, 57], [3.6, 58], [3.7, 59], [3.8, 60], [3.9, 61], [4.0, 62],
      [4.1, 63], [4.2, 64], [4.3, 65], [4.4, 66], [4.5, 67], [4.6, 68],
      [4.7, 69], [4.8, 70], [4.9, 71], [5.0, 72], [5.1, 73], [5.2, 74],
      [5.3, 75], [5.4, 76], [5.5, 77], [5.6, 78], [5.7, 79], [5.8, 80],
      [5.9, 81], [6.0, 82], [6.1, 83], [6.2, 84], [6.3, 85], [6.4, 86],
      [6.5, 87], [6.6, 88], [6.7, 89], [6.8, 90], [6.9, 91], [7.0, 92],
      [7.1, 93], [7.2, 94]
    ]
  },
  night: {
    label: 'noche',
    subMinPrice: 37,
    stdMinPrice: 42,
    baseKm: 4.9,
    basePrice: 74,
    ratePerKm: 15,
    points: [
      [1.7, 42], [1.8, 43], [1.9, 44], [2.0, 45], [2.1, 46], [2.2, 47],
      [2.3, 48], [2.4, 49], [2.5, 50], [2.6, 51], [2.7, 52], [2.8, 53],
      [2.9, 54], [3.0, 55], [3.1, 56], [3.2, 57], [3.3, 58], [3.4, 59],
      [3.5, 60], [3.6, 61], [3.7, 62], [3.8, 63], [3.9, 64], [4.0, 65],
      [4.1, 66], [4.2, 67], [4.3, 68], [4.4, 69], [4.5, 70], [4.6, 71],
      [4.7, 72], [4.8, 73], [4.9, 74]
    ]
  },
  dawn: {
    label: 'madrugada',
    subMinPrice: 40,
    stdMinPrice: 45,
    baseKm: 4.1,
    basePrice: 70,
    ratePerKm: 17,
    points: [
      [1.7, 45], [1.8, 46], [1.9, 47], [2.0, 48], [2.1, 49], [2.2, 50],
      [2.3, 51], [2.4, 52], [2.5, 53], [2.6, 54], [2.7, 55], [2.8, 56],
      [2.9, 57], [3.0, 58], [3.1, 59], [3.2, 60], [3.3, 61], [3.4, 62],
      [3.5, 63], [3.6, 64], [3.7, 65], [3.8, 66], [3.9, 67], [4.0, 68],
      [4.1, 70]
    ]
  }
};

// ── Tarifas foráneas: a partir de 17.01 km, precio fijo por km ──
const foraneaRanges = [
  { name: 'Tarifa foránea 1', min: 17.01, max: 25.9,  pricePerKm: 15 },
  { name: 'Tarifa foránea 2', min: 26,    max: 69.9,  pricePerKm: 14 },
  { name: 'Tarifa foránea 3', min: 70,    max: 139.9, pricePerKm: 13 },
  { name: 'Tarifa foránea 4', min: 140,   max: 200,   pricePerKm: 12 }
];


// ═════════════════════════════════════
//  FUNCIONES DE BÚSQUEDA Y CÁLCULO
// ═════════════════════════════════════

/**
 * Formatea un número de km para mostrar sin decimales innecesarios
 */
function formatKm(km) {
  return Number(km.toFixed(2)).toString();
}

/**
 * Calcula la tarifa urbana continua de 0.0 a 17.0 km con interpolación peso a peso
 */
function lookupUrbanRateByConfig(config, km) {
  // 1. Sub-mínimo (0.0 - 1.30 km)
  if (km <= 1.3) {
    return {
      price: config.subMinPrice,
      desc: `Sub-mínimo (0.0 – 1.3 km)`
    };
  }

  // 2. Mínimo estándar (1.31 - 1.70 km)
  if (km <= 1.7) {
    return {
      price: config.stdMinPrice,
      desc: `Mínimo estándar (1.31 – 1.7 km)`
    };
  }

  // 3. Tabla fija continua con interpolación lineal (1.7 km hasta baseKm)
  if (km <= config.baseKm) {
    const points = config.points;
    for (let i = 0; i < points.length - 1; i++) {
      const [km1, p1] = [points[i][0], points[i][points[i].length - 1]];
      const [km2, p2] = [points[i + 1][0], points[i + 1][points[i + 1].length - 1]];
      if (km >= km1 && km <= km2) {
        const ratio = (km2 === km1) ? 0 : (km - km1) / (km2 - km1);
        const interpolated = p1 + ratio * (p2 - p1);
        const finalPrice = Math.round(interpolated);
        return {
          price: finalPrice,
          desc: `Tarifa ${config.label} (tabla fija a ${formatKm(km)} km)`
        };
      }
    }
  }

  // 4. Cálculo por km continuo desde baseKm hasta 17.0 km (peso por peso)
  if (km > config.baseKm && km <= 17.0) {
    const extraKm = km - config.baseKm;
    const totalPrice = Math.round(config.basePrice + extraKm * config.ratePerKm);

    return {
      price: totalPrice,
      desc: `Tarifa ${config.label}: $${config.basePrice} (base ${config.baseKm} km) + ${formatKm(extraKm)} km a $${config.ratePerKm}/km`
    };
  }

  return null;
}

/**
 * Calcula la tarifa foránea para un km dado.
 * Retorna { price, name, desc } o null si no aplica.
 */
function lookupForaneaRate(km) {
  for (const range of foraneaRanges) {
    if (km >= range.min && km <= range.max) {
      const total = Math.round(km * range.pricePerKm);
      return {
        price: total,
        name: range.name,
        desc: `${formatKm(km)} km × $${range.pricePerKm}/km = $${total} MXN\nRango: ${range.min} – ${range.max} km`
      };
    }
  }
  // Fuera de rango (más de 200 km)
  if (km > 200) {
    return {
      price: Math.round(km * 12),
      name: 'Fuera de rango',
      desc: `Más de 200 km. Se estima con $12/km (Tarifa foránea 4)`
    };
  }
  return null;
}


// ═════════════════════
//  LÓGICA PRINCIPAL
// ═════════════════════

const input = document.getElementById('kmInput');
const emptyMsg = document.getElementById('emptyMsg');

// Elementos de tarjetas
const cardDay = document.getElementById('cardDay');
const cardNight = document.getElementById('cardNight');
const cardDawn = document.getElementById('cardDawn');
const cardForanea = document.getElementById('cardForanea');
const divForanea = document.getElementById('divForanea');
const badgeDay = document.getElementById('badgeDay');
const badgeNight = document.getElementById('badgeNight');
const badgeDawn = document.getElementById('badgeDawn');

// Escuchar cambios en el input
input.addEventListener('input', calculate);

function calculate() {
  const val = parseFloat(input.value);

  // Si no hay valor válido, ocultar todo
  if (isNaN(val) || val < 0) {
    hideAll();
    emptyMsg.style.display = 'block';
    return;
  }

  emptyMsg.style.display = 'none';
  const km = val;

  // ── Tarifas urbanas activas (0 – 17 km) ──
  if (km <= 17.0) {
    const day = lookupUrbanRateByConfig(urbanConfigs.day, km);
    const night = lookupUrbanRateByConfig(urbanConfigs.night, km);
    const dawn = lookupUrbanRateByConfig(urbanConfigs.dawn, km);

    // Quitar estado descartado
    setCardsDiscardedState(false);

    showCard(cardDay, 'priceDay', 'descDay', day);
    showCard(cardNight, 'priceNight', 'descNight', night);
    showCard(cardDawn, 'priceDawn', 'descDawn', dawn);

    // Ocultar foránea
    cardForanea.classList.remove('visible');
    divForanea.classList.remove('visible');
  }

  // ── Tarifas foráneas activas (17.01+ km): Urbanas quedan descartadas y tachadas ──
  if (km > 17.0) {
    // 1. Mostrar la tarifa foránea aplicable
    const foranea = lookupForaneaRate(km);
    if (foranea) {
      cardForanea.classList.add('visible');
      divForanea.classList.add('visible');
      divForanea.textContent = '── Tarifas urbanas (Descartadas por > 17 km) ──';
      document.getElementById('foraneName').textContent = foranea.name;
      document.getElementById('priceForanea').textContent = `$${foranea.price}`;
      document.getElementById('descForanea').textContent = foranea.desc;
    }

    // 2. Marcar las tarifas de horario como descartadas / tachadas
    setCardsDiscardedState(true);

    const day17 = lookupUrbanRateByConfig(urbanConfigs.day, 17.0);
    const night17 = lookupUrbanRateByConfig(urbanConfigs.night, 17.0);
    const dawn17 = lookupUrbanRateByConfig(urbanConfigs.dawn, 17.0);

    if (day17) day17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;
    if (night17) night17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;
    if (dawn17) dawn17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;

    showCard(cardDay, 'priceDay', 'descDay', day17);
    showCard(cardNight, 'priceNight', 'descNight', night17);
    showCard(cardDawn, 'priceDawn', 'descDawn', dawn17);
  }
}

/**
 * Activa o desactiva el estilo tachado/descartado en las tarjetas de horario
 */
function setCardsDiscardedState(isDiscarded) {
  const urbanCards = [cardDay, cardNight, cardDawn];
  const badges = [badgeDay, badgeNight, badgeDawn];

  urbanCards.forEach(card => {
    if (isDiscarded) {
      card.classList.add('discarded');
    } else {
      card.classList.remove('discarded');
    }
  });

  badges.forEach(badge => {
    badge.style.display = isDiscarded ? 'inline-block' : 'none';
  });
}

/**
 * Muestra una tarjeta con precio y descripción
 */
function showCard(card, priceId, descId, data) {
  if (data) {
    card.classList.add('visible');
    document.getElementById(priceId).textContent = `$${data.price}`;
    document.getElementById(descId).textContent = data.desc;
  } else {
    card.classList.remove('visible');
  }
}

/**
 * Oculta todas las tarjetas
 */
function hideAll() {
  [cardDay, cardNight, cardDawn, cardForanea].forEach(c => c.classList.remove('visible'));
  setCardsDiscardedState(false);
  divForanea.classList.remove('visible');
}

// ═════════════════════════════════════
//  SOPORTE DE PWA / INSTALACIÓN
// ═════════════════════════════════════

// Registro del Service Worker para soporte offline e instalación
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.error('Error registrando Service Worker:', err);
    });
  });
}

// Capturar evento de instalación de Google Chrome
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  // Prevenir que Chrome muestre el banner por defecto
  e.preventDefault();
  deferredPrompt = e;
  // Mostrar nuestro botón personalizado
  if (installBtn) {
    installBtn.style.display = 'block';
  }
});

if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choiceResult = await deferredPrompt.userChoice;
      if (choiceResult.outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    }
  });
}

window.addEventListener('appinstalled', () => {
  if (installBtn) {
    installBtn.style.display = 'none';
  }
});
</script>
</body>
</html>
