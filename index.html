<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tarifas</title>
  <style>
    /* ── Reset y base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Contenedor principal ── */
    .container { max-width: 480px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #f8fafc;
    }

    /* ── Input de kilómetros ── */
    .input-group {
      background: #1a1d2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      font-size: 1.3rem;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      text-align: center;
      outline: none;
    }
    .input-group input:focus { border-color: #60a5fa; }

    /* ── Tarjetas de resultado ── */
    .results { display: flex; flex-direction: column; gap: 10px; }

    .card {
      border-radius: 12px;
      padding: 14px 16px;
      display: none; /* se muestra con JS */
    }
    .card.visible { display: block; }

    .card-day { background: linear-gradient(135deg, #1e3a5f, #1a2744); border-left: 4px solid #facc15; }
    .card-night { background: linear-gradient(135deg, #1e2a4a, #141c33); border-left: 4px solid #818cf8; }
    .card-dawn { background: linear-gradient(135deg, #2a1a3e, #1a1130); border-left: 4px solid #c084fc; }
    .card-foranea { background: linear-gradient(135deg, #1a3333, #112222); border-left: 4px solid #34d399; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-title { font-size: 0.9rem; font-weight: 600; }
    .card-price { font-size: 1.5rem; font-weight: 700; }
    .card-desc { font-size: 0.75rem; color: #94a3b8; line-height: 1.4; }

    /* ── Tarjetas descartadas / tachadas para cuando aplica foránea ── */
    .card.discarded {
      opacity: 0.45;
      filter: grayscale(40%);
      position: relative;
    }
    .card.discarded .card-price {
      text-decoration: line-through;
      text-decoration-color: #ef4444;
      color: #94a3b8;
    }
    .card-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }
    .badge-discarded {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .badge-active {
      background: rgba(52, 211, 153, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    /* ── Separador ── */
    .divider {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin: 12px 0 6px;
      display: none;
      font-weight: 600;
    }
    .divider.visible { display: block; }

    /* ── Mensaje vacío ── */
    .empty-msg {
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚕 Calculadora de Tarifas</h1>

    <!-- Campo de entrada -->
    <div class="input-group">
      <label for="kmInput">Kilómetros del viaje</label>
      <input type="number" id="kmInput" placeholder="Ej: 8.5" min="0" max="200" step="0.1" inputmode="decimal">
    </div>

    <!-- Resultados -->
    <div class="results" id="results">
      <p class="empty-msg" id="emptyMsg">Ingresa los kilómetros para calcular</p>

      <!-- Tarjeta foránea (se muestra primero si supera 17 km) -->
      <div class="card card-foranea" id="cardForanea">
        <div class="card-header">
          <div>
            <span class="card-title">🛣️ <span id="foraneName">Foránea</span></span>
            <span class="card-badge badge-active" id="badgeForanea">Tarifa Aplicable</span>
          </div>
          <span class="card-price" id="priceForanea">—</span>
        </div>
        <p class="card-desc" id="descForanea"></p>
      </div>

      <!-- Separador de estado -->
      <div class="divider" id="divForanea">── Tarifas de ciudad / horario ──</div>

      <!-- Tarjetas de tarifas urbanas (Día, Noche, Madrugada) -->
      <div class="card card-day" id="cardDay">
        <div class="card-header">
          <div>
            <span class="card-title">🌞 Día</span>
            <span class="card-badge badge-discarded" id="badgeDay" style="display: none;">Descartada</span>
          </div>
          <span class="card-price" id="priceDay">—</span>
        </div>
        <p class="card-desc" id="descDay"></p>
      </div>

      <div class="card card-night" id="cardNight">
        <div class="card-header">
          <div>
            <span class="card-title">🌙 Noche</span>

        </div>
        <p class="card-desc" id="descNight"></p>
      </div>

      <div class="card card-dawn" id="cardDawn">

          <span class="card-price" id="priceDawn">—</span>
        </div>
        <p class="card-desc" id="descDawn"></p>
      </div>
    </div>
  </div>

  [16.9, 16.9, 287], [17.0, 17.0, 289]
];

// ── Tarifas foráneas: a partir de 17.01 km, precio fijo por km ──
const foraneaRanges = [
  { name: 'Tarifa foránea 1', min: 17.01, max: 25.9,  pricePerKm: 15 },
  { name: 'Tarifa foránea 2', min: 26,    max: 69.9,  pricePerKm: 14 },
  { name: 'Tarifa foránea 3', min: 70,    max: 139.9, pricePerKm: 13 },
  { name: 'Tarifa foránea 4', min: 140,   max: 200,   pricePerKm: 12 }
];


// ═════════════════════════════════════
//  FUNCIONES DE BÚSQUEDA Y CÁLCULO
// ═════════════════════════════════════

/**
 * Busca el precio en una tabla de tarifas para un km dado (hasta 17.0 km).
 * Retorna { price, desc } o null si no aplica.
 */
function lookupUrbanRate(table, km, label) {
  const rounded = Math.round(km * 10) / 10; // redondear a 1 decimal

  for (const [lo, hi, price] of table) {
    if (rounded >= lo && rounded <= hi) {
      let desc = '';
      if (hi <= 1.3) {
        desc = `Sub-mínimo (0.0 – 1.3 km)`;
      } else if (hi <= 1.7) {
        desc = `Mínimo estándar (1.31 – 1.7 km)`;
      } else if (rounded > 10.0) {
        // Detalle de cobro después de los 10 km
        const ratePerKm = label === 'día' ? 13 : (label === 'noche' ? 15 : 17);
        const basePrice = label === 'día' ? 130 : (label === 'noche' ? 150 : 170);
        const extraKm = (rounded - 10.0).toFixed(1);
        desc = `Tarifa ${label}: $${basePrice} (base 10 km) + ${extraKm} km extra a $${ratePerKm}/km`;
      } else {
        desc = `Tarifa ${label} a ${rounded} km`;
      }
      return { price, desc };
    }
  }

  return null;
}

/**
 * Calcula la tarifa foránea para un km dado.
 * Retorna { price, name, desc } o null si no aplica.
 */
function lookupForaneaRate(km) {
  for (const range of foraneaRanges) {
    if (km >= range.min && km <= range.max) {
      const total = Math.round(km * range.pricePerKm);
      return {
        price: total,
        name: range.name,
        desc: `${km} km × $${range.pricePerKm}/km = $${total} MXN\nRango: ${range.min} – ${range.max} km`
      };
    }
  }
  // Fuera de rango (más de 200 km)
  if (km > 200) {
    return {
      price: Math.round(km * 12),
      name: 'Fuera de rango',
      desc: `Más de 200 km. Se estima con $12/km (Tarifa foránea 4)`
    };
  }
  return null;
}


// ═════════════════════
//  LÓGICA PRINCIPAL
// ═════════════════════

const input = document.getElementById('kmInput');
const emptyMsg = document.getElementById('emptyMsg');

// Elementos de tarjetas
const cardDay = document.getElementById('cardDay');
const cardNight = document.getElementById('cardNight');
const cardDawn = document.getElementById('cardDawn');
const cardForanea = document.getElementById('cardForanea');
const divForanea = document.getElementById('divForanea');
const badgeDay = document.getElementById('badgeDay');
const badgeNight = document.getElementById('badgeNight');
const badgeDawn = document.getElementById('badgeDawn');

// Escuchar cambios en el input
input.addEventListener('input', calculate);

function calculate() {
  const val = parseFloat(input.value);

  // Si no hay valor válido, ocultar todo
  if (isNaN(val) || val < 0) {
    hideAll();
    emptyMsg.style.display = 'block';
    return;
  }

  emptyMsg.style.display = 'none';
  const km = Math.round(val * 10) / 10;

  // ── Tarifas urbanas activas (0 – 17 km) ──
  if (km <= 17.0) {
    const day = lookupUrbanRate(dayTable, km, 'día');
    const night = lookupUrbanRate(nightTable, km, 'noche');
    const dawn = lookupUrbanRate(dawnTable, km, 'madrugada');

    // Quitar estado descartado
    setCardsDiscardedState(false);

    showCard(cardDay, 'priceDay', 'descDay', day);
    showCard(cardNight, 'priceNight', 'descNight', night);
    showCard(cardDawn, 'priceDawn', 'descDawn', dawn);

    // Ocultar foránea
    cardForanea.classList.remove('visible');
    divForanea.classList.remove('visible');
  }

  // ── Tarifas foráneas activas (17.01+ km): Urbanas quedan descartadas y tachadas ──
  if (km > 17.0) {
    // 1. Mostrar la tarifa foránea aplicable
    const foranea = lookupForaneaRate(km);
    if (foranea) {
      cardForanea.classList.add('visible');
      divForanea.classList.add('visible');
      divForanea.textContent = '── Tarifas urbanas (Descartadas por > 17 km) ──';
      document.getElementById('foraneName').textContent = foranea.name;
      document.getElementById('priceForanea').textContent = `$${foranea.price}`;
      document.getElementById('descForanea').textContent = foranea.desc;
    }

    // 2. Marcar las tarifas de horario como descartadas / tachadas
    setCardsDiscardedState(true);

    const day17 = lookupUrbanRate(dayTable, 17.0, 'día');
    const night17 = lookupUrbanRate(nightTable, 17.0, 'noche');
    const dawn17 = lookupUrbanRate(dawnTable, 17.0, 'madrugada');

    if (day17) day17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;
    if (night17) night17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;
    if (dawn17) dawn17.desc = `Descartada: Supera los 17 km. Aplica tarifario foráneo fijo`;

    showCard(cardDay, 'priceDay', 'descDay', day17);
    showCard(cardNight, 'priceNight', 'descNight', night17);
    showCard(cardDawn, 'priceDawn', 'descDawn', dawn17);
  }
}

/**
 * Activa o desactiva el estilo tachado/descartado en las tarjetas de horario
 */
function setCardsDiscardedState(isDiscarded) {
  const urbanCards = [cardDay, cardNight, cardDawn];
  const badges = [badgeDay, badgeNight, badgeDawn];

  urbanCards.forEach(card => {
    if (isDiscarded) {
      card.classList.add('discarded');
    } else {
      card.classList.remove('discarded');
    }
  });

  badges.forEach(badge => {
    badge.style.display = isDiscarded ? 'inline-block' : 'none';
  });
}

/**
 * Muestra una tarjeta con precio y descripción
 */
function showCard(card, priceId, descId, data) {
  if (data) {
    card.classList.add('visible');
    document.getElementById(priceId).textContent = `$${data.price}`;
    document.getElementById(descId).textContent = data.desc;
  } else {
    card.classList.remove('visible');
  }
}

/**
 * Oculta todas las tarjetas
 */
function hideAll() {
  [cardDay, cardNight, cardDawn, cardForanea].forEach(c => c.classList.remove('visible'));
  setCardsDiscardedState(false);
  divForanea.classList.remove('visible');
}
</script>
